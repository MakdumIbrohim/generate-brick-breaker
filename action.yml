name: 'Generate Brick Breaker'
description: 'Generate animated retro brick breaker game (SVG or GIF) from GitHub contribution graph'
author: 'MakdumIbrohim'
branding:
  icon: 'play'
  color: 'green'
inputs:
  github_token:
    description: 'GitHub Token for fetching GraphQL contributions'
    required: false
    default: ${{ github.token }}
  github_user:
    description: 'Target GitHub username'
    required: false
    default: ${{ github.repository_owner }}
  output_path:
    description: 'Path for output file (supports .gif or .svg)'
    required: false
    default: 'game.svg'
  ball_skin:
    description: 'Ball elemental skin theme (classic, fire, ice, lightning, poison)'
    required: false
    default: 'classic'
  theme:
    description: 'Canvas board visual theme (classic, sky, sky-night, synthwave, matrix, sakura)'
    required: false
    default: 'classic'
  paddle_skin:
    description: 'Paddle visual skin theme (classic, laser, retro, mecha, cyber)'
    required: false
    default: 'classic'
  brick_color:
    description: 'Custom brick color HEX code (classic theme only: 1 HEX for auto-gradient, or 4 comma-separated HEX for levels 1-4)'
    required: false
    default: ''
  ball_speed:
    description: 'Custom ball speed (slow, normal, fast, turbo, or number 2.5-20, default: normal)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      shell: bash
      run: pip install pillow
    - name: Run generator
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: python ${{ github.action_path }}/generate.py "${{ inputs.github_user }}" "${{ inputs.output_path }}" "${{ inputs.ball_skin }}" "${{ inputs.theme }}" "${{ inputs.paddle_skin }}" "${{ inputs.brick_color }}" "${{ inputs.ball_speed }}"
